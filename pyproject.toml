[project]
name = "gen-list-spacy"
version = "0.1.0"
description = "Extract nouns and verbs from German text files using SpaCy"
requires-python = ">=3.13"
dependencies = [
    "blis",
    "catalogue",
    "certifi",
    "charset-normalizer",
    "click",
    "colorama",
    "cymem",
    "idna",
    "jinja2",
    "markupsafe",
    "murmurhash",
    "numpy",
    "packaging",
    "pathy",
    "preshed",
    "pydantic",
    "pyparsing",
    "requests",
    "smart-open",
    "spacy>=3.8.0",
    "spacy-legacy",
    "srsly",
    "thinc",
    "tqdm",
    "typer",
    "typing-extensions",
    "urllib3>=2.0.7",
    "wasabi",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
gen_list = "gen_list.__main__:generate_list"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen_list"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]